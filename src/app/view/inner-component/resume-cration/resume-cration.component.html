<div class="">
  <div class=" d-flex">
    <div class="col-md-2 bg-light " style="height:auto;">
      <div class="d-flex justify-content-center">
        <img class="mt-2" src="../../../../assets/images/Frame 34335050.svg" alt="">
      </div>
      <div class="mt-5">
        <p-timeline [value]="timlineData">
          <ng-template #content let-event>
            {{ event.status }}
          </ng-template>
        </p-timeline>
      </div>
    </div>
    <div class="col-md-10 ">
      <nav class="navbar navbar-expand-lg navbar-light bg-white">
        <div class="container d-flex justify-content-between">
          <div class="navbar-brand "><span class="text-prime kt-pointer">
              <img src="../../../../assets/images/keyboard_backspace.svg" alt=""> <span class="fs14 mx-2 text-prime">Go To Dashboard</span>
            </span></div>

          <div>
          <div class="fs14 text-prime">
            Sample_Resume <img class="fs14" src="../../../../assets/images/border_color.svg" alt="">
          </div>
          </div>
          <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <!-- <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <form class="form-inline my-2 my-lg-0">
          </form>
        </div> -->
        </div>
      </nav>

       <div class="mt-5">
        <span class="mt-3 p-4 text-prime ">Personal information</span>
      <div class="p-4 ms-5 mt-3 " style="border: 1px solid #EAEAF0; border-radius: 10px ;">
        <!-- <app-basic-info></app-basic-info> -->
        <app-working-history class="mt-2"></app-working-history>
        <app-experience-info *ngIf="_isShowWorkExp" class="mt-2"></app-experience-info>

      </div>

      <div class="d-flex justify-content-between">

        <div class="d-flex justify-content-start mt-5  px-6 gap-3">
          <button type="button" class="btn btn-outline btn-light btntextColor mt-3   bt-5 resumeBtn">Back</button>
        </div>
        <div class="d-flex justify-content-end mt-5 gap-3">
          <button type="button" class="btn btn-outline btn-light btntextColor mt-3 bt-5 resumeBtn">Preview</button>
          <button type="button" class="btn btn-outline btn-light btntextColor mt-3 bt-5 resumeBtn">Next</button>
        </div>
      </div>
      </div>


    </div>

  </div>

</div>
