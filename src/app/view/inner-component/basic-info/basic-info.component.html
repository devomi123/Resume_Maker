<div class="container-fluid">

  <div>
    <img src="../../../../assets/images/user_attributes.svg" alt=""> <span class="px-3 text-prime fs-16">Let's get
      started with the basics</span>
    <form [formGroup]="personalInfoForm">
      <div class="row mt-4">
        <div class="col-md-4 mb-3 px-4">
          <label class="fs14" for="">First Name</label>
          <input type="text" class="form-control fs14" formControlName="firstName" placeholder="First Name"
            aria-label="First Name">
        </div>
        <div class="col-md-4 mb-3 px-4">
          <label class="fs14" for="">Middle Name</label>
          <input type="text" class="form-control fs14" formControlName="middleName" placeholder="Middle Name"
            aria-label="Last Name">
        </div>
        <div class="col-md-4 mb-3 px-4">
          <label class="fs14" for="">Last Name</label>
          <input type="text" class="form-control fs14" formControlName="lastName" placeholder="Last Name"
            aria-label="Last Name">
        </div>
        <div class="col-md-12 mb-3 px-4">
          <label class="fs14" for="">Profession</label>
          <input type="text" class="form-control fs14" formControlName="profession" placeholder="Profession"
            aria-label="Profession">
        </div>
        <div class="col-md-6 mb-3 px-4">
          <label class="fs14" for="">Mobile Number</label>
          <input type="text" class="form-control fs14" formControlName="mobileNumber" placeholder="Mobile Number"
            aria-label="Mobile Number">
        </div>
        <div class="col-md-6 mb-3 px-4">
          <label class="fs14" for="">Email ID</label>
          <input type="text" class="form-control fs14" formControlName="emailId" placeholder="Email ID"
            aria-label="Email ID">
        </div>
        <div class="col-md-6 mb-3 px-4">
          <label class="fs14" for="">Linkedin</label>
          <input type="text" class="form-control fs14" formControlName="linkdin" placeholder="Linkedin"
            aria-label="Linkedin">
        </div>
        <div class="col-md-6 mb-3 px-4">
          <label class="fs14" for="">Portfolio</label>
          <input type="text" class="form-control fs14" formControlName="portfolio" placeholder="Portfolio"
            aria-label="Portfolio">
        </div>
        <div class="col-md-6 mb-3 px-4">
          <label class="fs14" for="">City</label>
          <input type="text" class="form-control fs14" formControlName="city" placeholder="City" aria-label="City">
        </div>
        <div class="col-md-3 mb-3 px-4">
          <label class="fs14" for="">Country</label>
          <input type="text" class="form-control fs14" formControlName="country" placeholder="Country Name"
            aria-label="First Name">
        </div>
        <div class="col-md-3 mb-3 px-4">
          <label class="fs14" for="">Pin Code</label>
          <input type="text" class="form-control fs14" formControlName="pincode" placeholder="Pin Code"
            aria-label="Pin Code">
        </div>
        <div class=" col-md-6 mb-3 px-4 flex-auto">
          <label for="icondisplay" class=" fs14 block">Date Of Birth</label>
          <p-datepicker formControlName="dob"  [iconDisplay]="'input'" [showIcon]="true" inputId="icondisplay"  readonly/>
        </div>
        <div class="col-md-3 mb-3 px-4">
          <label class="fs14" for="">Marital Status</label>
          <input type="text" class="form-control fs14" formControlName="maritalstatus" placeholder="Marital Status"
            aria-label="Marital Status">
        </div>
        <div class="col-md-3 mb-3 px-4">
          <label class="fs14" for="">Gender</label>
          <input type="text" class="form-control fs14" formControlName="gender" placeholder="Gender"
            aria-label="Gender">
        </div>

      </div>
      <div class="d-flex justify-content-sm-center">
        <div class="d-flex justify-content-end mt-5 gap-3">
          <button type="button" class="btn btn-outline iconColorHover  btntextColor mt-3   bt-5 resumeBtn"
         >Back</button>
          <button type="button" class="btn btn-outline iconColorHover  btntextColor mt-3 bt-5 resumeBtn">Preview</button>
          <button type="button" class="btn btn-outline iconColorHover btntextColor mt-3 bt-5 resumeBtn"
           (click)="saveNext('Work History')">Save and Next</button>
        </div>
      </div>
    </form>

  </div>
